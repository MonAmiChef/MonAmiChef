            type: string
          x-nestjs_zod-parent-additional-properties: false
        exclude:
          type: array
          items:
            type: string
          x-nestjs_zod-parent-additional-properties: false
      required:
        - id
        - title
        - messages
        - createdAt
        - updatedAt
